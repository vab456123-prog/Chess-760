<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Projects Hub</title>
    <style>
        :root {
            --bg-color: #f8faff;
            --card-bg: #ffffff;
            --text-color: #172033;
            --text-dim: #64748b;
            --border: #e2e8f0;
            --shadow: 0 8px 32px rgba(30,58,138,0.10);

            /* Цвета оригинального дизайна */
            --chess: #2e7d32;
            --lang: #b45309;
            --code: #3b5ccc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }

        /* Верхняя навигационная панель */
        .navbar {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-color);
        }

        /* Переключатель языков RU / EN */
        .lang-switch {
            display: inline-flex;
            background-color: #f1f5f9;
            padding: 0.25rem;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .lang-btn {
            background: none;
            border: none;
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            color: #94a3b8;
            transition: all 0.2s;
        }

        .lang-btn.active {
            background-color: #172033;
            color: #ffffff;
        }

        /* Центрированное горизонтальное меню */
        .navbar-menu {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .navbar-menu a {
            text-decoration: none;
            color: #64748b;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: color 0.2s;
        }

        .navbar-menu a:hover {
            color: var(--text-color);
        }

        /* Основной баннер-шапка */
        header {
            text-align: center;
            padding: 4rem 1rem 3rem 1rem;
            background: linear-gradient(135deg, #eef2ff 0%, #f8faff 50%, #e8f5e9 100%);
            border-bottom: 1px solid var(--border);
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.8rem;
            margin: 0 0 0.5rem 0;
            font-weight: 800;
        }

        header p {
            color: var(--text-dim);
            font-size: 1.15rem;
            max-width: 700px;
            margin: 0 auto;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem 3rem 1rem;
        }

        /* Сетка проектов */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 2rem;
            margin-bottom: 5rem;
        }

        .project-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        /* Цветные шапки карточек */
        .card-header {
            padding: 2rem;
            color: #ffffff;
            min-height: 110px;
            box-sizing: border-box;
        }
        .project-card.chess-card .card-header { background-color: var(--chess); }
        .project-card.lang-card .card-header { background-color: var(--lang); }
        .project-card.code-card .card-header { background-color: var(--code); }

        .card-header .icon-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0 0 0.25rem 0;
        }

        .card-header p {
            margin: 0;
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .card-body {
            padding: 2rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-body > p {
            color: var(--text-dim);
            font-size: 0.95rem;
            margin-top: 0;
            margin-bottom: 1.5rem;
            min-height: 70px;
        }

        /* Списки преимуществ в картах */
        .features-list {
            list-style: none;
            padding: 0;
            margin: 0 0 2rem 0;
            flex-grow: 1;
        }

        .features-list li {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 1rem;
            font-size: 0.95rem;
            color: #334155;
        }

        .features-list .li-icon {
            font-size: 1.1rem;
            display: inline-block;
            min-width: 20px;
            text-align: center;
        }

        /* Теги технологий */
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .tag {
            background-color: #f1f5f9;
            color: #64748b;
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid #e2e8f0;
        }

        /* Кнопки действий */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.85rem;
            border-radius: 8px;
            font-weight: 700;
            text-decoration: none;
            color: #ffffff;
            transition: background-color 0.2s;
            box-sizing: border-box;
            margin-top: auto;
        }

        .project-card.chess-card .btn { background-color: var(--chess); }
        .project-card.lang-card .btn { background-color: var(--lang); }
        .project-card.code-card .btn { background-color: var(--code); }

        .btn:hover { filter: brightness(90%); }

        /* Секция миссии */
        .mission-section {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 3.5rem 2.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            text-align: center;
        }

        .mission-section h2 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 1.5rem;
        }

        .mission-intro {
            font-size: 1.1rem;
            color: var(--text-dim);
            max-width: 850px;
            margin: 0 auto 1.5rem auto;
            line-height: 1.6;
        }

        .mission-sub {
            font-size: 1.05rem;
            color: var(--text-dim);
            max-width: 800px;
            margin: 0 auto 3rem auto;
        }

        /* Сетка бенефитов миссии */
        .benefits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .benefit-card {
            background-color: #ffffff;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .benefit-icon { font-size: 2rem; margin-bottom: 1rem; }
        .benefit-card h3 { font-size: 1.1rem; font-weight: 700; margin: 0 0 0.5rem 0; }
        .benefit-card p { font-size: 0.9rem; color: var(--text-dim); margin: 0; line-height: 1.5; }

        /* Адаптивность для мобильных телефонов */
        @media (max-width: 768px) {
            .navbar { flex-direction: column; gap: 1rem; text-align: center; padding: 1rem; }
            .navbar-menu { flex-direction: column; gap: 0.75rem; }
        }
    </style>
</head>

        <div class="navbar-menu">

    </nav>
